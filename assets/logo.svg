<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="gA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/><stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="gB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="gC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/><stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="gD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c084fc"/><stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- dark rounded tile -->
  <rect x="4" y="4" width="112" height="112" rx="26" fill="#0b1020"/>
  <rect x="4" y="4" width="112" height="112" rx="26" fill="none" stroke="#223" stroke-width="1.5"/>
  <!-- mosaic "M": two pillars + center V, built from offset tiles -->
  <g filter="url(#glow)">
    <rect x="22" y="30" width="18" height="60" rx="6" fill="url(#gA)"/>
    <rect x="80" y="30" width="18" height="60" rx="6" fill="url(#gD)"/>
    <rect x="43" y="30" width="15" height="15" rx="5" fill="url(#gB)" transform="rotate(8 50 37)"/>
    <rect x="52.5" y="47" width="15" height="15" rx="5" fill="url(#gC)" transform="rotate(-6 60 54)"/>
    <rect x="62" y="30" width="15" height="15" rx="5" fill="url(#gC)" transform="rotate(-8 70 37)"/>
  </g>
</svg>
